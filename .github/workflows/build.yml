name: Build FlowCoreX

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn clean package

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: FlowCoreX
          path: target/FlowCoreX-1.0.0.jar
